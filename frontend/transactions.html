<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>

    assets/style.css
</head>

<body>

    <div class="navbar">
        <h1>FinTrust Risk Monitoring System</h1>

        <div class="nav-links">
            index.htmlHome</a>
            dashboard.htmlDashboard</a>
            transactions.htmlTransactions</a>
        </div>
    </div>

    <div class="container">

        <h2>Transaction Monitoring</h2>

        <div class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Account Number..."
            >

            <select id="riskFilter">
                <option value="ALL">All Risks</option>
                <option value="HIGH">High Risk</option>
                <option value="MEDIUM">Medium Risk</option>
                <option value="LOW">Low Risk</option>
            </select>

        </div>

        <div class="action-buttons">
            <button id="sortAmount">
                Sort by Amount
            </button>

            <button id="sortRisk">
                Sort by Risk
            </button>

            <button id="exportCsv">
                Export CSV
            </button>
        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Account</th>
                    <th>Amount</th>
                    <th>Country</th>
                    <th>Risk Level</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="transactionTable">
            </tbody>

        </table>

    </div>

    assets/transactions.jsscript>

</body>

</html>
